name: Build ZARVES APK
on:
  workflow_dispatch:
  push:
    branches: [ "zarves-build" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Download speaker model
        run: |
          mkdir -p app/src/main/assets
          curl -L --fail --retry 3 -o app/src/main/assets/speaker.onnx https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-recongition-models/3dspeaker_speech_eres2net_base_sv_zh-cn_3dspeaker_16k.onnx
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: ZARVES-debug-APK, path: app/build/outputs/apk/debug/app-debug.apk }
